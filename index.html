<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta content="width=device-width,initial-scale=1" name="viewport">
  <title>Forex Trend Trading Bot</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="app">
    <h1>Forex Trend Trading Bot</h1>
    <p class="subtitle">Paste closing prices to analyze market trend and generate a simple signal.</p>

    <div class="card">
      <label for="prices">Closing prices (comma or newline separated)</label>
      <textarea id="prices" rows="8">1.079,1.081,1.083,1.082,1.084,1.086,1.089,1.091,1.093,1.095,1.094,1.096,1.099,1.102,1.105</textarea>

      <div class="controls">
        <label>Fast SMA <input id="fastPeriod" type="number" min="2" value="5"></label>
        <label>Slow SMA <input id="slowPeriod" type="number" min="3" value="10"></label>
        <label>RSI Period <input id="rsiPeriod" type="number" min="3" value="14"></label>
      </div>

      <button id="analyzeBtn">Analyze Trend</button>
    </div>

    <div class="card" id="result">
      <h2>Analysis</h2>
      <p><strong>Trend:</strong> <span id="trendValue">-</span></p>
      <p><strong>Signal:</strong> <span id="signalValue">-</span></p>
      <p><strong>Fast SMA:</strong> <span id="fastSmaValue">-</span></p>
      <p><strong>Slow SMA:</strong> <span id="slowSmaValue">-</span></p>
      <p><strong>RSI:</strong> <span id="rsiValue">-</span></p>
      <p id="message"></p>
    </div>
  </main>

  <script src="./script.js"></script>
</body>

</html>
